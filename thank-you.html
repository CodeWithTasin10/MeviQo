<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | MeviQo</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="antialiased min-h-screen flex items-center justify-center px-6">
    <main class="glass rounded-3xl p-8 md:p-12 max-w-xl w-full text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-cyan to-[#017896]"></div>
        <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-brand-cyan/10 flex items-center justify-center">
            <i data-lucide="check-circle" class="w-9 h-9 text-brand-cyan"></i>
        </div>
        <p class="text-brand-cyan text-sm font-semibold uppercase tracking-widest mb-3">Message Received</p>
        <h1 class="text-3xl md:text-4xl font-bold text-white mb-4">Thanks for reaching out.</h1>
        <p class="text-gray-400 leading-relaxed mb-8">Your message has been sent to MeviQo. We'll get back to you soon.</p>
        <a href="index.html" class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r from-brand-cyan to-[#017896] text-white font-semibold hover:shadow-[0_0_20px_rgba(2,146,183,0.35)] transition-all">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to MeviQo
        </a>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
