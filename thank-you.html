<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | MeviQo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --bg: #071116;
            --primary: #0292b7;
            --primary-light: #20b9df;
            --text: #ffffff;
            --muted: #8ea1aa;
            --border: rgba(255, 255, 255, 0.08);
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            font-family: 'Outfit', sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(2, 146, 183, 0.18),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(2, 146, 183, 0.12),
                    transparent 32%
                ),
                var(--bg);

            color: var(--text);
        }


        .card {
            width: min(520px, 100%);

            padding: 55px 40px;

            text-align: center;

            background: rgba(15, 30, 38, 0.72);

            border: 1px solid var(--border);

            border-radius: 25px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.3);
        }


        .success-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(2, 146, 183, 0.12);

            border: 1px solid rgba(32, 185, 223, 0.25);

            box-shadow:
                0 0 35px rgba(2, 146, 183, 0.15);
        }


        .success-icon svg {
            width: 34px;
            height: 34px;

            stroke: var(--primary-light);
        }


        .label {
            color: var(--primary-light);

            font-size: 12px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 2px;

            margin-bottom: 14px;
        }


        h1 {
            font-size: clamp(42px, 7vw, 58px);

            line-height: 1;

            letter-spacing: -2px;

            margin-bottom: 20px;
        }


        p {
            color: var(--muted);

            font-size: 15px;

            line-height: 1.7;

            max-width: 400px;

            margin: 0 auto 30px;
        }


        .back-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 14px 25px;

            border-radius: 11px;

            background: var(--primary);

            color: white;

            font-size: 14px;
            font-weight: 600;

            transition: 0.3s;
        }


        .back-btn:hover {
            background: var(--primary-light);

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(2, 146, 183, 0.2);
        }


        .brand {
            margin-top: 35px;

            color: #52636a;

            font-size: 13px;
        }


        @media (max-width: 500px) {

            .card {
                padding: 45px 25px;
            }

        }

    </style>

</head>


<body>

    <div class="card">

        <div class="success-icon">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >

                <path
                    d="M5 12.5L9.5 17L19 7.5"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </svg>

        </div>


        <div class="label">
            Email Received
        </div>


        <h1>
            Thank you!
        </h1>


        <p>
            Your email has been received successfully.
            We'll get back to you soon.
        </p>


        <a
            href="index.html"
            class="back-btn"
        >
            ← Back to MeviQo
        </a>


        <div class="brand">
            MeviQo • Building Tomorrow, Today.
        </div>

    </div>

</body>
</html>
