<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | MeviQo</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family: 'Outfit', sans-serif;
            color: #fff;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(2, 146, 183, 0.18),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(2, 146, 183, 0.08),
                    transparent 30%
                ),
                #07131a;
        }

        .card {
            width: 100%;
            max-width: 560px;
            position: relative;

            padding: 48px 40px;
            text-align: center;

            background: rgba(15, 30, 38, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.45),
                0 0 40px rgba(2, 146, 183, 0.06);

            animation: cardIn 0.7s ease-out;
        }

        /* Top glowing line */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 15%;
            width: 70%;
            height: 2px;

            background: linear-gradient(
                90deg,
                transparent,
                #0292b7,
                transparent
            );

            box-shadow: 0 0 15px rgba(2, 146, 183, 0.7);
        }

        /* Icon */
        .icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background: rgba(2, 146, 183, 0.1);
            border: 1px solid rgba(2, 146, 183, 0.2);

            box-shadow:
                0 0 35px rgba(2, 146, 183, 0.12);
        }

        .icon svg {
            width: 38px;
            height: 38px;
            color: #20b9df;
        }

        /* Small heading */
        .label {
            margin-bottom: 10px;

            color: #20b9df;
            font-size: 13px;
            font-weight: 600;

            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Main heading */
        h1 {
            margin-bottom: 14px;

            font-size: 42px;
            line-height: 1.15;
            letter-spacing: -1.5px;
            font-weight: 700;
        }

        /* Description */
        .message {
            max-width: 420px;
            margin: 0 auto 32px;

            color: #94a3b8;
            font-size: 16px;
            line-height: 1.7;
        }

        /* Button */
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            padding: 13px 22px;

            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #0292b7,
                #017896
            );

            box-shadow:
                0 8px 25px rgba(2, 146, 183, 0.2);

            transition: 0.25s ease;
        }

        .back-btn svg {
            width: 17px;
            height: 17px;
        }

        .back-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 35px rgba(2, 146, 183, 0.32);
        }

        .back-btn:active {
            transform: translateY(0);
        }

        /* Animation */
        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .card {
                padding: 40px 24px;
                border-radius: 24px;
            }

            h1 {
                font-size: 34px;
            }

            .message {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <!-- Success Icon -->
        <div class="icon">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9 12.75 11.25 15 15 9.75"
                />
                <circle cx="12" cy="12" r="9" />
            </svg>
        </div>

        <div class="label">
            Email Received
        </div>

        <h1>
            Thank you!
        </h1>

        <p class="message">
            Your email has been received successfully.
            We'll get back to you soon.
        </p>

        <a href="index.html" class="back-btn">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
                />
            </svg>

            Back to MeviQo
        </a>

    </main>

</body>
</html>
